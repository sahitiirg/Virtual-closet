<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Closet</title>
    <link rel="stylesheet" href="style.css">
 </head>   
<body>
    <h1>My Closet</h1>

<main class="layout">
  <section class="preview">
    <svg id="avatar" viewBox="0 0 200 400"></svg>
    <div class="maker">
  <label>Skin <input type="color" id="pick-skin"></label>
  <label>Hair <input type="color" id="pick-hair"></label>
  <label>Eyes <input type="color" id="pick-eyes"></label>
  <label>Base <input type="color" id="pick-base"></label>
</div>
    </section>

    <section class="closet">
        <p>Closet items will go here.</p>
    </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
